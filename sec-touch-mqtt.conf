[bus]
port = /dev/ttyUSB1
address = 5
# seconds to only listen after the controller (re)started
startup_wait = 60
# set the controller's clock to the server's local time if it is off by more than clock_tolerance seconds
clock_fix = true
clock_tolerance = 60

[mqtt]
host = localhost
port = 1883
user = lueftung
password = INSERT_PASSWORD
topic = sec_touch
discovery_prefix = homeassistant

[system]
# Order = fan pair 1 to 6
rooms = Room 1, Room 2, Room 3, Room 4, Room 5, Room 6
